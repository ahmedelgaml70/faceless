name: Generate Gemini Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Optional science topic (leave blank to rotate topic list)
        required: false
        type: string
  # Enable only after the first manual generation succeeds:
  # schedule:
  #   - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: faceless-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: gemini
      LLM_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      SCRIPT_REVIEW: rewrite
      SCRIPT_STYLE: explainer
      LANGUAGE: en
      TARGET_SECONDS: '42'
      NICHES: 'space and the universe,physics discoveries,biology mysteries'
      TTS_ENGINE: kokoro
      VIDEO_ENCODER: libx264
      RESOLUTION: 720x1280
      FPS: '24'
      CAPTION_STYLE: clean
      VISUAL_SOURCES: local
      MEDIA_DIR: media
      WORKERS: '1'
      UPLOAD: 'false'
      YT_PRIVACY: private
      KEEP_VIDEOS: 'true'
      YT_TOKEN_FILE: token.json
      YT_DAILY_LIMIT: '1'
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PRIVATE_UPLOAD_ENABLED: ${{ vars.PRIVATE_UPLOAD_ENABLED || 'false' }}
      MANUAL_TOPIC: ${{ inputs.topic || '' }}
      PYTHONUTF8: '1'

    steps:
      - name: Checkout faceless
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required Gemini secret
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo 'Missing GEMINI_API_KEY. Add a repository Actions secret first.'
            exit 1
          fi

      - name: Install FFmpeg, Kokoro and pinned PurffleShorts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          git clone https://github.com/Chamanrajragu/purffle-shorts.git engine
          git -C engine checkout --detach bab8d5f97b8452d72287b0ee3af3cb8cc1a23bc8
          python -m pip install -e './engine[kokoro]'

      - name: Generate original draft and render video
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          TOPIC="$(python ../scripts/select_topic.py ../topics.txt)"
          echo "Topic: $TOPIC"

          if [[ -n "$PIXABAY_API_KEY" ]]; then
            export VISUAL_SOURCES='pixabay,local'
          fi

          if [[ "$PRIVATE_UPLOAD_ENABLED" == 'true' ]]; then
            if [[ -z "$YOUTUBE_TOKEN_JSON" ]]; then
              echo 'Private upload enabled but YOUTUBE_TOKEN_JSON secret missing' >&2
              exit 1
            fi
            printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
            chmod 600 token.json
            python - <<'PY_AUTH'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          creds = Credentials.from_authorized_user_file("token.json")
          if not creds.refresh_token:
              raise SystemExit("YouTube token has no refresh_token")
          if not creds.valid:
              creds.refresh(Request())
          if not creds.valid:
              raise SystemExit("YouTube OAuth token expired or invalid")
          with open("token.json", "w", encoding="utf-8") as f:
              f.write(creds.to_json())
          PY_AUTH
            export UPLOAD='true'
            export YT_PRIVACY='private'
            python -m purffle_shorts make --topic "$TOPIC" --privacy private
          else
            python -m purffle_shorts make --topic "$TOPIC" --no-upload
          fi

      - name: Save preview files for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview-${{ github.run_number }}
          path: |
            engine/output_videos/**/*.mp4
            engine/output_videos/**/metadata.json
            engine/output_videos/**/captions.srt
            engine/output_videos/**/script.json
            engine/output_videos/**/cover.jpg
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
