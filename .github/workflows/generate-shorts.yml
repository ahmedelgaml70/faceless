name: Generate Gemini Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Optional science topic (leave blank for automatic rotation)
        required: false
        type: string
  # After reviewing multiple successful videos, optionally enable daily previews:
  # schedule:
  #   - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: faceless-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      SCRIPT_REVIEW: rewrite
      SCRIPT_STYLE: explainer
      LANGUAGE: en
      TARGET_SECONDS: '42'
      NICHES: 'space and the universe,physics discoveries,biology mysteries'
      TTS_ENGINE: kokoro
      VIDEO_ENCODER: libx264
      RESOLUTION: 720x1280
      FPS: '24'
      CAPTION_STYLE: clean
      VISUAL_SOURCES: local
      MEDIA_DIR: media
      CHANNEL_NAME: Faceless Science
      WATERMARK: none
      END_CTA: What surprised you most?
      WORKERS: '1'
      UPLOAD: 'false'
      YT_PRIVACY: private
      KEEP_VIDEOS: 'true'
      YT_TOKEN_FILE: token.json
      YT_DAILY_LIMIT: '1'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout faceless
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Kokoro and pinned PurffleShorts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          git clone https://github.com/Chamanrajragu/purffle-shorts.git engine
          git -C engine checkout --detach bab8d5f97b8452d72287b0ee3af3cb8cc1a23bc8
          python -m pip install -e './engine[kokoro]'

      - name: Prepare script and scene-specific licensed images
        working-directory: engine
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo 'Missing GEMINI_API_KEY in Settings → Secrets and variables → Actions'
            exit 1
          fi
          TOPIC="$(python ../scripts/select_topic.py ../topics.txt)"
          echo "Topic: $TOPIC"
          python ../scripts/prepare_content.py "$TOPIC"

      - name: Render reviewed-script draft
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python -m purffle_shorts make --script prepared/script.json --no-upload

      - name: Gate video, media licences, and technical quality
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python ../scripts/quality_check.py

      # This step runs ONLY if video quality checks pass and the owner explicitly
      # enables private uploads. No public video is ever published here.
      - name: Optional upload as PRIVATE to YouTube
        if: ${{ vars.PRIVATE_UPLOAD_ENABLED == 'true' }}
        working-directory: engine
        shell: bash
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$YOUTUBE_TOKEN_JSON" ]]; then
            echo 'PRIVATE_UPLOAD_ENABLED=true but YOUTUBE_TOKEN_JSON is missing'
            exit 1
          fi
          umask 077
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          export YT_PRIVACY=private
          python -m purffle_shorts upload --pending

      - name: Save script, video, sources and QA report for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview-${{ github.run_number }}
          path: |
            engine/output_videos/**/*.mp4
            engine/output_videos/**/metadata.json
            engine/output_videos/**/captions.srt
            engine/output_videos/**/script.json
            engine/output_videos/**/cover.jpg
            engine/prepared/script.json
            engine/prepared/visual_manifest.json
            engine/prepared/quality_report.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
